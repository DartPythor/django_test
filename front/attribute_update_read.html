<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Редактирование атрибута</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link rel="stylesheet" href="css/styles.css"/>
</head>
<body class="bg-light">
<nav class="bg-white border-bottom mb-4 py-3">
    <div class="container d-flex justify-content-start">
        <div class="btn-group me-2">
            <button type="button" class="btn btn-dark dropdown-toggle" data-bs-toggle="dropdown">Техника</button>
            <ul class="dropdown-menu">
                <li><a class="dropdown-item" href="#">Создать тип</a></li>
                <li><a class="dropdown-item" href="#">Список типов</a></li>
                <li><a class="dropdown-item" href="#">Создать технику</a></li>
                <li><a class="dropdown-item" href="#">Список техники</a></li>
            </ul>
        </div>
        <div class="btn-group me-2">
            <button type="button" class="btn btn-dark dropdown-toggle" data-bs-toggle="dropdown">Запчасти</button>
            <ul class="dropdown-menu">
                <li><a class="dropdown-item" href="#">Создать тип</a></li>
                <li><a class="dropdown-item" href="#">Список типов</a></li>
                <li><a class="dropdown-item" href="#">Создать запчасть</a></li>
                <li><a class="dropdown-item" href="#">Список запчастей</a></li>
            </ul>
        </div>
        <div class="btn-group">
            <button type="button" class="btn btn-dark dropdown-toggle" data-bs-toggle="dropdown">Атрибуты</button>
            <ul class="dropdown-menu">
                <li><a class="dropdown-item" href="#">Создать атрибут</a></li>
                <li><a class="dropdown-item" href="#">Список атрибутов</a></li>
            </ul>
        </div>
    </div>
</nav>
<div class="container">
    <h2 class="mb-4">Редактирование атрибута</h2>
    <form>
        <div class="mb-3">
            <label for="attrName" class="form-label">Название</label>
            <input type="text" class="form-control" id="attrName" value="Диаметр" required>
        </div>

        <div class="mb-3">
            <label for="attrUnit" class="form-label">Единица измерения</label>
            <input type="text" class="form-control" id="attrUnit" value="мм" required>
        </div>

        <div class="mb-3">
            <label for="attrType" class="form-label">Тип данных</label>
            <select class="form-select" id="attrType">
                <option value="decimal" selected>decimal</option>
                <option value="integer">integer</option>
                <option value="string">string</option>
                <option value="boolean">boolean</option>
            </select>
        </div>

        <div class="mb-3">
            <label class="form-label">Дата создания</label>
            <input type="text" class="form-control readonly-field" value="2024-01-10" readonly>
        </div>

        <div class="mb-3">
            <label class="form-label">Дата обновления</label>
            <input type="text" class="form-control readonly-field" value="2024-03-02" readonly>
        </div>

        <div class="mb-4">
            <label class="form-label">Удалено</label>
            <div class="readonly-field">
                <span class="fw-bold text-purple fs-5">×</span>
            </div>
        </div>

        <button type="submit" class="btn btn-primary btn-save">Сохранить</button>
    </form>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
