<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Создание запчасти</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link rel="stylesheet" href="css/styles.css"/>
</head>
<body class="bg-light">
<nav class="bg-white border-bottom mb-4 py-3">
    <div class="container d-flex justify-content-start">
        <div class="container-fluid">
            <div class="btn-group me-2">
                <button type="button" class="btn btn-dark dropdown-toggle" data-bs-toggle="dropdown">Техника</button>
                <ul class="dropdown-menu">
                    <li><a class="dropdown-item" href="#">Создать тип</a></li>
                    <li><a class="dropdown-item" href="#">Список типов</a></li>
                    <li><a class="dropdown-item" href="#">Создать технику</a></li>
                    <li><a class="dropdown-item" href="#">Список техники</a></li>
                </ul>
            </div>
            <div class="btn-group me-2">
                <button type="button" class="btn btn-dark dropdown-toggle" data-bs-toggle="dropdown">Запчасти</button>
                <ul class="dropdown-menu">
                    <li><a class="dropdown-item" href="#">Создать тип</a></li>
                    <li><a class="dropdown-item" href="#">Список типов</a></li>
                    <li><a class="dropdown-item" href="#">Создать запчасть</a></li>
                    <li><a class="dropdown-item" href="#">Список запчастей</a></li>
                </ul>
            </div>
            <div class="btn-group">
                <button type="button" class="btn btn-dark dropdown-toggle" data-bs-toggle="dropdown">Атрибуты</button>
                <ul class="dropdown-menu">
                    <li><a class="dropdown-item" href="#">Создать атрибут</a></li>
                    <li><a class="dropdown-item" href="#">Список атрибутов</a></li>
                </ul>
            </div>
        </div>
    </div>
</nav>
<div class="container">
    <h2 class="mb-4">Создание запчасти</h2>
    <form id="partForm">
        <div class="mb-3">
            <label for="part-type" class="form-label">Тип запчасти</label>
            <select class="form-select" id="part-type" required>
                <option value="">Выберите тип...</option>
            </select>
        </div>

        <div class="mb-3">
            <label for="assigned-to-equipment" class="form-label">Закрепить за техникой</label>
            <select class="form-select" id="assigned-to-equipment">
                <option value="">Выберите технику...</option>
            </select>
        </div>

        <div class="mb-3">
            <label for="status" class="form-label">Статус</label>
            <select class="form-select" id="status">
                <option value="installed">Установлено</option>
            </select>
        </div>

        <h5 class="mt-4">Атрибуты</h5>
        <table class="table table-bordered align-middle">
            <thead class="table-light">
            <tr>
                <th scope="col" class="text-center" style="width: 40px;"></th>
                <th scope="col">Название</th>
                <th scope="col">Значение</th>
            </tr>
            </thead>
            <tbody>
            <tr>
                <td class="text-center">
                    <input class="form-check-input" type="checkbox" id="attr1" checked>
                </td>
                <td>Диаметр (мм)</td>
                <td><input type="text" class="form-control" value="Например: 50"></td>
            </tr>
            <tr>
                <td class="text-center">
                    <input class="form-check-input" type="checkbox" id="attr2">
                </td>
                <td>Вес (кг)</td>
                <td><input type="text" class="form-control" value="Например: 3.2"></td>
            </tr>
            </tbody>
        </table>

        <div class="mb-3">
            <label class="form-label">Фотографии</label>
            <input type="file" class="form-control mb-2" name="photo1">
            <input type="file" class="form-control mb-2" name="photo2">
            <input type="file" class="form-control mb-2" name="photo3">
        </div>

        <button type="submit" class="btn btn-primary">Сохранить</button>
    </form>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
